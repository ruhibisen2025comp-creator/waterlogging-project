<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune Waterlogging System</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🌧️ Pune Waterlogging ML Monitor</h1>
    <p>AI-Powered Geospatial & Weather Waterlogging Risk Analyzer</p>
</header>

<!-- LOCATION SELECTION -->
<section class="city-section">
    <label for="locationInput">Select or Enter Pune Area:</label>
    <input type="text" id="locationInput" list="puneLocations" placeholder="e.g. Swargate, Kothrud, Hadapsar, Bavdhan">
    <datalist id="puneLocations">
        <option value="Swargate"></option>
        <option value="Kothrud"></option>
        <option value="Hadapsar"></option>
        <option value="Bavdhan"></option>
        <option value="Wanowrie"></option>
    </datalist>

    <button onclick="checkRisk()">Check Waterlogging Risk</button>
</section>

<!-- RISK & MODEL INFORMATION -->
<section class="weather-card">
    <h2 id="cityName">Location: --</h2>
    <p id="coordinates">Coordinates: --</p>
    <p id="forecast">Waterlogging Forecast: --</p>
    <h2 id="risk">Waterlogging Risk: --</h2>
    <div id="alertBox"></div>
</section>

<!-- MAP SECTION -->
<section class="map-section">
    <h2>🗺️ Interactive Area Map</h2>
    <div id="map" style="height: 400px; width: 100%; border-radius: 10px;"></div>
</section>

<!-- Leaflet JS & App Script -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
