<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune Waterlogging System</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>🌧️ Pune Waterlogging ML Monitor</h1>
    <p>AI-Powered Geospatial & Weather Waterlogging Risk Analyzer</p>
</header>

<!-- LOCATION SELECTION -->
<section class="city-section">
    <label for="locationInput">Select or Enter Pune Area:</label>
    <input type="text" id="locationInput" list="puneLocations" placeholder="e.g. Swargate, Kothrud, Hadapsar, Baner">
    <datalist id="puneLocations">
        <option value="Swargate"></option>
        <option value="Kothrud"></option>
        <option value="Hadapsar"></option>
        <option value="Baner"></option>
        <option value="Aundh"></option>
        <option value="Shivajinagar"></option>
        <option value="Deccan"></option>
        <option value="Karve Nagar"></option>
        <option value="Viman Nagar"></option>
        <option value="Katraj"></option>
        <option value="Bavdhan"></option>
        <option value="Wanowrie"></option>
    </datalist>

    <button id="searchBtn" onclick="checkRisk()">Check Waterlogging Risk</button>
</section>

<!-- RISK & MODEL INFORMATION (7 DATASET PARAMETERS) -->
<section class="weather-card">
    <h2 id="cityName">Location: Pune Central</h2>
    <p id="coordinates">Coordinates: --</p>
    
    <div class="metrics-grid" style="display: flex; flex-wrap: wrap; gap: 15px; margin: 10px 0;">
        <p><strong>Precipitation:</strong> <span id="precipVal">--</span></p>
        <p><strong>Humidity:</strong> <span id="humidityVal">--</span></p>
        <p><strong>Elevation:</strong> <span id="elevationVal">--</span></p>
        <p><strong>Slope:</strong> <span id="slopeVal">--</span></p>
        <p><strong>Low Basin:</strong> <span id="basinVal">--</span></p>
    </div>

    <p id="forecast">Waterlogging Forecast: --</p>
    <h2 id="risk">Waterlogging Risk: --</h2>
    <div id="alertBox"></div>
</section>

<!-- MAP SECTION -->
<section class="map-section">
    <h2>🗺️ Interactive Area Map</h2>
    <div id="map" style="height: 400px; width: 100%; border-radius: 10px;"></div>
</section>

<!-- Leaflet JS & App Script -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
